<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASUS Design Center: Pixel Odyssey</title>
<style>
:root{
  --ink:#3a3552;
  --cream:#fff8e7;
  --cream-deep:#ffedc2;
  --border:#3a3552;
  --hp:#ff5d7a;
  --mp:#4d96ff;
  --sp:#ffc93c;
  --exp:#9b5de5;
  --teal:#2ec4b6;
  --orange:#ff8c42;
  --shadow: 0 4px 0 rgba(58,53,82,0.35);
}
*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; min-height:100%;
  color:var(--ink);
  font-family:'Trebuchet MS','Verdana',sans-serif;
}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,0.5) 0, transparent 45%),
    linear-gradient(180deg,#9fe0ff 0%,#c8f0ff 35%,#eafff0 100%);
  min-height:100vh;
}
#app{ max-width:900px; margin:0 auto; padding:16px 12px 60px; }

.screen{ display:flex; flex-direction:column; gap:14px; }

.game-title{
  text-align:center; font-size:24px; line-height:1.5; font-weight:900;
  color:#ff6b3d;
  text-shadow:2px 2px 0 #fff, 4px 4px 0 var(--ink);
  margin:10px 0 0;
}
.game-title span{ color:#2ec4b6; text-shadow:2px 2px 0 #fff, 4px 4px 0 var(--ink); }
.tagline{ text-align:center; color:#5a5477; font-size:13px; margin:0 0 10px; font-weight:bold; }

.section-title{
  font-size:15px; font-weight:900; color:#fff; background:var(--orange);
  border:3px solid var(--border); border-radius:10px;
  display:inline-block; padding:6px 14px; box-shadow:var(--shadow);
  margin:6px 0;
}

/* --- buttons / panels: chunky rounded Kairosoft-ish style --- */
button{
  font-family:inherit; cursor:pointer; color:var(--ink); font-weight:bold;
  background:var(--cream);
  border:3px solid var(--border);
  border-radius:12px;
  box-shadow: var(--shadow);
  padding:10px 12px; font-size:12px; text-align:left;
  transition: transform 0.06s ease, box-shadow 0.06s ease;
}
button:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 6px 0 rgba(58,53,82,0.35); }
button:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 rgba(58,53,82,0.35); }
button:disabled{ opacity:0.45; cursor:not-allowed; }
button small{ display:block; font-size:10px; color:#6b6489; margin-top:4px; font-weight:normal; }

.btn-primary{ background:#baf7c9; border-color:#2a9d4f; }
.btn-secondary{ background:var(--cream); }
.btn-danger{ background:#ffd2da; border-color:var(--hp); }

/* --- era / class select --- */
.era-grid, .class-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.era-card, .class-card{ display:flex; flex-direction:column; gap:4px; background:var(--cream); border-width:4px; border-radius:16px; }
.era-year{ font-size:20px; color:#ff6b3d; font-weight:900; }
.era-name, .class-name{ font-size:13px; font-weight:900; color:var(--ink); }
.era-desc, .class-passive{ font-size:11px; color:#5a5477; font-weight:normal; }
.era-bonus{ font-size:11px; color:#2a9d4f; font-weight:bold; }
.class-icon{
  font-size:20px; width:34px; height:34px; line-height:34px; text-align:center;
  border-radius:50%; border:3px solid var(--border); box-shadow:var(--shadow);
}
.class-stats{ font-size:10px; color:#6b6489; font-weight:normal; }
.class-skill{ font-size:10px; color:#1d6fc7; font-weight:bold; }
.continue-row{ text-align:center; margin-top:10px; }

/* --- bars: rounded pill style --- */
.bar{
  position:relative; height:20px; background:#fff; border:3px solid var(--border);
  border-radius:20px; overflow:hidden;
}
.bar-fill{ height:100%; border-radius:20px; transition:width 0.2s ease; }
.bar.hp .bar-fill{ background:linear-gradient(180deg,#ff8fa3,var(--hp)); }
.bar.mp .bar-fill{ background:linear-gradient(180deg,#8fc0ff,var(--mp)); }
.bar.sp .bar-fill{ background:linear-gradient(180deg,#ffe08a,var(--sp)); }
.bar.exp .bar-fill{ background:linear-gradient(180deg,#c9a3ff,var(--exp)); }
.bar.boss .bar-fill{ background:linear-gradient(180deg,#ffab7a,var(--orange)); }
.bar-text{
  position:absolute; left:8px; top:1px; font-size:10px; font-weight:900;
  color:var(--ink); text-shadow:1px 1px 0 rgba(255,255,255,0.6);
}

/* --- hub --- */
.hub-top{
  display:flex; align-items:center; gap:14px; background:var(--cream);
  border:4px solid var(--border); border-radius:16px; box-shadow:var(--shadow);
  padding:10px 14px; flex-wrap:wrap;
}
.hub-id{ flex:1; min-width:160px; }
.hub-name{ font-size:14px; font-weight:900; }
.hub-title{ font-size:11px; color:#c9660a; font-weight:bold; }
.hub-era{ font-size:10px; color:#6b6489; }
.hub-currency{ font-size:13px; color:#c9660a; font-weight:900; white-space:nowrap; }
.hub-bars{ display:flex; flex-direction:column; gap:6px; }
.pixel-avatar-frame{ width:32px; height:32px; position:relative; flex:none; image-rendering:pixelated; }
.pixel-avatar-dot{ position:absolute; top:0; left:0; width:4px; height:4px; }

/* --- office view: top-down walking sprites, Game Dev Story style --- */
.office-view{
  position:relative; height:110px;
  background:repeating-linear-gradient(90deg,#ffe9c2 0 20px,#ffdca0 20px 40px);
  border:4px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
}
.office-label{
  position:absolute; top:6px; left:6px; z-index:3;
  background:rgba(255,255,255,0.85); border:2px solid var(--border); border-radius:8px;
  padding:2px 8px; font-size:9px; font-weight:900; color:var(--ink);
}
.office-desk{
  position:absolute; bottom:6px; width:44px; height:24px;
  background:#a9713f; border:3px solid var(--border); border-radius:6px; z-index:1;
}
.office-monitor{
  position:absolute; left:8px; top:-16px; width:22px; height:14px;
  background:#2b2d42; border:2px solid var(--border); border-radius:3px;
}
.office-monitor::after{
  content:''; position:absolute; left:2px; top:2px; width:14px; height:8px;
  background:#7fd7ff; border-radius:2px;
}
.office-walker{
  position:absolute;
  animation-name:officePatrol; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  z-index:2;
}
@keyframes officePatrol{
  0%{ transform:translateX(0); }
  50%{ transform:translateX(var(--patrol-range,60px)); }
  100%{ transform:translateX(0); }
}

.faction-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.faction-card{ display:flex; flex-direction:column; gap:4px; border-width:4px; border-radius:16px; background:var(--cream); }
.faction-name{ font-weight:900; font-size:13px; }
.faction-desc{ font-size:11px; color:#5a5477; font-weight:normal; }

.hub-actions{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }

.log-panel{
  background:#fffef6; border:3px dashed #c9c2e8; border-radius:14px;
  padding:8px 10px; max-height:220px; overflow-y:auto;
}
.log-panel.small{ max-height:120px; }
.log-panel h3{ margin:0 0 6px; font-size:12px; color:#6b6489; }
.log-panel ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.log-panel li{ font-size:11px; border-left:4px solid #d8d2f0; padding-left:6px; font-weight:bold; }
.log-good{ border-color:#2a9d4f !important; color:#1f7a3c; }
.log-bad{ border-color:var(--hp) !important; color:#c23a54; }
.log-event{ border-color:var(--sp) !important; color:#a8720a; }
.log-levelup{ border-color:var(--exp) !important; color:#7c3fc4; }
.log-warn{ border-color:var(--orange) !important; color:#c9660a; }
.log-info{ color:#5a5477; }

/* --- faction quests --- */
.faction-desc-full{ font-size:12px; color:#5a5477; font-weight:bold; }
.quest-list{ display:flex; flex-direction:column; gap:10px; }
.quest-card{
  background:var(--cream); border:4px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow); padding:10px; display:flex; flex-direction:column; gap:6px;
}
.quest-name{ font-weight:900; font-size:13px; }
.quest-meta{ font-size:10px; color:#6b6489; font-weight:normal; }

/* --- boss --- */
.boss-title{ color:#e0396b; text-align:center; }
.boss-rounds{ text-align:center; font-size:12px; color:#c9660a; font-weight:bold; }
.card-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.card-btn{ text-align:center; }
.skill-btn{ border-color:var(--exp); background:#eee0ff; }

/* --- shop --- */
.currency-line{ font-size:14px; color:#c9660a; font-weight:900; }
.shop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.shop-card{
  display:flex; flex-direction:column; gap:6px; background:var(--cream);
  border:4px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:10px;
}
.shop-name{ font-weight:900; font-size:13px; }
.shop-desc{ font-size:11px; color:#5a5477; font-weight:normal; }

/* --- weekend --- */
.weekend-choices{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }

@media (max-width:480px){
  .game-title{ font-size:18px; }
  .hub-currency{ width:100%; }
}
</style>
</head>

  { id:'film', name:'底片攝影與老鏡頭收藏', desc:'品味 Taste +10（降低 Boss 防禦）', cost:220, apply:s=>{s.taste=(s.taste||0)+10;} },

const RANDOM_EVENTS = [
  { id:'midnight_reply', name:'深夜的一句話回覆', desc:'V.P. 在會議紀錄上只回了「再想想」四個字。你必須消耗雙倍 MP 施放【讀心術】才能正確解讀，猜錯將觸發返工地獄。',

    resolve(state, log){ state.hp=Math.min(state.maxHP,state.hp+10); state.mp=Math.min(state.maxMP,state.mp+10); log('HP/MP 各恢復 10，人間溫暖。','good'); } },

/* ---------- STATE ---------- */

const SAVE_KEY = 'asus_pixel_odyssey_save_v1';

function freshState(eraId, classId){
  const era = ERAS.find(e=>e.id===eraId);
  const cls = CLASSES.find(c=>c.id===classId);
  const stats = Object.assign({}, cls.stats);
  Object.keys(era.bonus).forEach(k=> stats[k]=(stats[k]||0)+era.bonus[k]);
  const maxHP = 100 + Math.round(stats.RES*0.6);
  const maxMP = 50 + Math.round(stats.PRO*0.3 + stats.CRE*0.3);
  return {
    eraId, classId, stats,
    hp:maxHP, maxHP, mp:maxMP, maxMP, sp:100, maxSP:100,
    crit:0.05, taste:0, gold:50, rep:0, exp:0,
    questMpCostReduce:0, questsDone:0, skillUsedThisFight:false,
    shieldScopeChange:false,
    log:[],
    taste_ratio(){ return Math.min(0.25, this.taste/100); },
  };
}

function save(state){
  const {log, ...rest} = state;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(rest)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    data.log = [];
    data.taste_ratio = function(){ return Math.min(0.25, this.taste/100); };
    return data;
  }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---------- HELPERS ---------- */

function getClass(state){ return CLASSES.find(c=>c.id===state.classId); }
function getEra(state){ return ERAS.find(e=>e.id===state.eraId); }

function gradeIndex(exp){
  let idx=0;
  for(let i=0;i<GRADE_EXP.length;i++){ if(exp>=GRADE_EXP[i]) idx=i; }
  return idx;
}
function roleIndex(rep){
  let idx=0;
  for(let i=0;i<ROLE_REP.length;i++){ if(rep>=ROLE_REP[i]) idx=i; }
  return idx;
}

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

let activeFaction = null;
let activeBoss = null;
let weekCounter = 0;

function pushLog(msg, type){
  if(!state) return;
  state.log.unshift({msg, type: type||'info'});
  state.log = state.log.slice(0,30);
}

function statLabel(key){
  return {CRE:'創意力', PRO:'專業力', COM:'溝通力', RES:'抗壓力'}[key] || key;
}

function bar(value, max, cls){
  const pct = clamp(Math.round(value/max*100),0,100);
  return `<div class="bar ${cls}"><div class="bar-fill" style="width:${pct}%"></div><span class="bar-text">${cls.toUpperCase()} ${Math.round(value)}/${max}</span></div>`;
}

function gridToShadows(grid, colorHex, yOffsetRows){
  const rowOffset = (yOffsetRows||0)*4;
  let shadows = [];
  grid.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      if(row[x]==='#') shadows.push(`${x*4}px ${y*4+rowOffset}px 0 0 ${colorHex}`);
    }
  });
  return shadows.join(',');
}

const HEAD_GRID = [
  '..####..',
  '.######.',
  '.######.',
  '.######.',
];
const EYE_GRID = [
  '........',
  '........',
  '..#..#..',
  '........',
];
// Two leg poses for a simple walk cycle.
const BODY_GRID_STAND = [
  '##.##.##',
  '.######.',
  '.##..##.',
  '.##..##.',
];
const BODY_GRID_STEP = [
  '##.##.##',
  '.######.',
  '..##.##.',
  '.##..#..',
];

function pixelAvatar(bodyColor){
  // Cute chibi-style 8x8 sprite (Kairosoft-ish): big round head + eyes + small body,
  // drawn as three 4px-pixel layers positioned absolutely inside a fixed 32x32 frame
  // so the box-shadow "pixels" can't bleed into sibling layout.
  const head = gridToShadows(HEAD_GRID, SKIN_TONE, 0);
  const eyes = gridToShadows(EYE_GRID, EYE_COLOR, 0);
  const body = gridToShadows(BODY_GRID_STAND, bodyColor, 4);
  return `<div class="pixel-avatar-frame">
    <div class="pixel-avatar-dot" style="box-shadow:${body}"></div>
    <div class="pixel-avatar-dot" style="box-shadow:${head}"></div>
    <div class="pixel-avatar-dot" style="box-shadow:${eyes}"></div>
  </div>`;
}

/* ---- office view: Game-Dev-Story-style top-down walking sprites ---- */
const walkAnimCache = new Set();
function walkAnimName(color){
  return 'walk-' + color.replace('#','');
}
function ensureWalkAnimation(color){
  const name = walkAnimName(color);
  if(walkAnimCache.has(name)) return name;
  walkAnimCache.add(name);
  const a = gridToShadows(BODY_GRID_STAND, color, 4);
  const b = gridToShadows(BODY_GRID_STEP, color, 4);
  let styleEl = document.getElementById('dynamic-anim');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'dynamic-anim';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent += `@keyframes ${name}{0%,49%{box-shadow:${a}}50%,100%{box-shadow:${b}}}`;
  return name;
}

function officeWalker(color, opts){
  const name = ensureWalkAnimation(color);
  const head = gridToShadows(HEAD_GRID, SKIN_TONE, 0);
  const eyes = gridToShadows(EYE_GRID, EYE_COLOR, 0);
  const body = gridToShadows(BODY_GRID_STAND, color, 4);
  const dur = opts.duration || 6;
  const delay = opts.delay || 0;
  const range = opts.range || 60;
  const bottom = opts.bottom || 4;
  return `<div class="office-walker" style="left:${opts.left}px; bottom:${bottom}px; --patrol-range:${range}px; animation-duration:${dur}s; animation-delay:-${delay}s;">
    <div class="pixel-avatar-frame">
      <div class="pixel-avatar-dot" style="box-shadow:${body}; animation:${name} 0.7s steps(1) infinite;"></div>
      <div class="pixel-avatar-dot" style="box-shadow:${head}"></div>
      <div class="pixel-avatar-dot" style="box-shadow:${eyes}"></div>
    </div>
  </div>`;
}

function renderOfficeView(playerColor){
  const npcColors = ['#4d96ff','#2ec4b6'].filter(c=>c!==playerColor);
  const walkers = [
    officeWalker(playerColor, {left:20, duration:5.5, delay:0, range:70, bottom:6}),
    officeWalker(npcColors[0]||'#4d96ff', {left:120, duration:7, delay:1.5, range:50, bottom:6}),
    officeWalker(npcColors[1]||'#2ec4b6', {left:220, duration:6.2, delay:3, range:60, bottom:6}),
  ];
  const deskLefts = [30,110,190,270];
  const desks = deskLefts.map(l=>`
    <div class="office-desk" style="left:${l}px">
      <div class="office-monitor"></div>
    </div>`).join('');
  return `<div class="office-view">
    <div class="office-label">辦公室 Live</div>
    ${desks}
    ${walkers.join('')}
  </div>`;
}

function render(){
  if(currentScreen==='class'){ renderClassSelect(); return; }
  if(currentScreen==='title' || !state){ renderTitle(); return; }
  save(state);
  if(currentScreen==='hub') renderHub();
  else if(currentScreen==='faction') renderFaction();
  else if(currentScreen==='boss') renderBoss();
  else if(currentScreen==='shop') renderShop();
  else if(currentScreen==='weekend') renderWeekend();
  else renderTitle();
}

function doQuest(faction, quest){
  const mpCost = Math.max(2, 10 + quest.tier*4 - (state.questMpCostReduce||0));
  if(state.mp < mpCost){
    pushLog('MP 不足，無法執行任務！先去休息或喝咖啡吧。','bad');
    render(); return;
  }
  state.mp -= mpCost;
  const statVal = state.stats[quest.statKey];
  let successChance = 0.45 + statVal/220 + state.taste_ratio() - (faction.diff-1)*0.15;
  successChance = clamp(successChance, 0.1, 0.95);
  const success = Math.random() < successChance;
  if(success){
    let expGain = quest.exp, goldGain = quest.gold;
    if(Math.random() < state.crit){ expGain=Math.round(expGain*1.5); goldGain=Math.round(goldGain*1.5); pushLog('暴擊！這次的提案效果拔群。','good'); }
    state.exp += expGain; state.gold += goldGain; state.rep += Math.round(quest.tier*3);
    state.questsDone++;
    pushLog(`完成任務「${quest.name}」，獲得 EXP +${expGain}、Gold +${goldGain}。`,'good');
  } else {
    state.hp = Math.max(1, state.hp - (4+quest.tier*2));
    pushLog(`任務「${quest.name}」不太順利，產出了一版「大便設計」……HP -${4+quest.tier*2}`,'bad');
  }
  checkLevelUp();
  maybeRandomEvent();
  render();
}

/* ---- Boss fight ---- */
function startBossFight(){
  const idx = clamp(gradeIndex(state.exp), 0, BOSSES.length-1);
  const template = BOSSES[idx];
  activeBoss = { name:template.name, hp:template.hp, maxHp:template.hp, dmg:template.dmg, rounds:5 };
  state.skillUsedThisFight = false;
  state.skillEffects = {};
  currentScreen='boss'; render();
}

function cardDamage(baseStatKey){
  const cls = getClass(state);
  let val = state.stats[baseStatKey];
  let dmg = val * (0.6 + Math.random()*0.5);
  if(cls.skill.type==='passive' && cls.skill.mult) dmg *= cls.skill.mult;
  if(state.skillEffects && state.skillEffects.dmgMult) dmg *= state.skillEffects.dmgMult;
  if(state.skillEffects && state.skillEffects.ignoreDefense) dmg *= 1.3;
  dmg *= (1 + state.taste_ratio());
  return Math.round(dmg);
}

  const cls = getClass(state);
  root.innerHTML = `
    <div class="screen boss-screen">

        <button class="card-btn" data-type="CRE">💡 設計理念<br><small>創意力傷害</small></button>
        <button class="card-btn" data-type="PRO">📊 數據佐證<br><small>專業力傷害</small></button>
        ${cls.skill.type==='active' ? `<button class="card-btn skill-btn" id="skillBtn">✨ ${cls.skill.name}<br><small>MP -${cls.skill.mp}（本場戰鬥限一次）</small></button>` : ''}
      </div>
      <div class="log-panel small">
        <ul>${state.log.slice(0,6).map(l=>`<li class="log-${l.type}">${l.msg}</li>`).join('')}</ul>
      </div>
    </div>`;
  root.querySelectorAll('.card-btn[data-type]').forEach(btn=>{
    btn.addEventListener('click', ()=> playCard(btn.dataset.type));
  });
  const skillBtn = document.getElementById('skillBtn');
  if(skillBtn) skillBtn.addEventListener('click', useSkill);
}

function playCard(statKey){
  if(activeBoss.rounds<=0) return;
  const mpCost = 12;
  if(state.mp < mpCost){ pushLog('MP 不足，無法出牌！','bad'); render(); return; }
  state.mp -= mpCost;
  const dmg = cardDamage(statKey);
  activeBoss.hp -= dmg;
  pushLog(`你打出「${statKey==='COM'?'簡報技巧':statKey==='CRE'?'設計理念':'數據佐證'}」，造成 ${dmg} 挑剔值傷害！`,'good');
  state.skillEffects = {};
  resolveBossTurn();
}

function useSkill(){
  const cls = getClass(state);
  if(state.skillUsedThisFight){ pushLog('這場戰鬥已經用過必殺技了。','bad'); render(); return; }
  if(state.mp < cls.skill.mp){ pushLog('MP 不足，無法施放必殺技！','bad'); render(); return; }
  state.mp -= cls.skill.mp;
  state.skillUsedThisFight = true;
  state.skillEffects = state.skillEffects || {};
  if(cls.id==='ID') state.skillEffects.dmgMult = 1.8;
  else if(cls.id==='CMF') { activeBoss.bonusGold = true; pushLog('【陽極處理】發動，本次任務獎金將大幅提升！','good'); }
  else if(cls.id==='UEUX') state.skillEffects.ignoreDefense = true;
  else if(cls.id==='PM') { state.shieldScopeChange = true; pushLog('【時程結界】展開，下一次「需求變更」事件將被完全格擋。','good'); }
  else if(cls.id==='TOOL') activeBoss.reduceCounter = true;
  else if(cls.id==='RESEARCH') state.skillEffects.dmgMult = 1.3;
  pushLog(`你發動了必殺技【${cls.skill.name}】！`,'good');
  render();
}

function resolveBossTurn(){
  activeBoss.rounds -= 1;
  if(activeBoss.hp <= 0){
    winBossFight(); return;
  }
  if(activeBoss.rounds <= 0){
    loseBossFight(); return;
  }
  // boss counter-attack
  const cls = getClass(state);
  let dmg = activeBoss.dmg;
  if(cls.id==='TOOL' && activeBoss.reduceCounter) dmg = Math.round(dmg*0.3);
  state.hp = Math.max(1, state.hp - dmg);
  pushLog(`${activeBoss.name} 反擊：「這個設計你自己會買嗎？」HP -${dmg}`,'bad');
  render();
}

function winBossFight(){
  const gradeIdx = gradeIndex(state.exp);
  let expGain = 80 + gradeIdx*20, goldGain = activeBoss.bonusGold ? 240 : 160, repGain = 40;
  state.exp += expGain; state.gold += goldGain; state.rep += repGain;
  pushLog(`你擊破了${activeBoss.name}的挑剔值！獲得 S 級績效：EXP +${expGain}、Gold +${goldGain}、聲望 +${repGain}。`,'good');
  checkLevelUp();
  currentScreen='hub'; render();
}

function loseBossFight(){
  state.sp = Math.max(0, state.sp - 15);
  state.hp = Math.max(1, state.hp - 10);
  pushLog(`會議結束，你的提案沒能撐到最後……HP -10、SP -15。下次準備更充分的簡報吧。`,'bad');
  checkSPCollapse();
  currentScreen='hub'; render();
}

/* ---- Random events / level ups ---- */
function maybeRandomEvent(){
  if(Math.random() < 0.3){
    const ev = RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
    pushLog(`【隨機事件】${ev.name}：${ev.desc}`,'event');
    ev.resolve(state, pushLog);
  }
}

function checkSPCollapse(){
  if(state.sp<=0 && !state.spCollapsed){
    state.spCollapsed = true;
    state.maxMP = Math.round(state.maxMP*0.8);
    state.mp = Math.min(state.mp, state.maxMP);
    pushLog('SP 歸零，觸發「後院起火 / 孤家寡人」Debuff：MaxMP 永久 -20%，直到你花時間修復關係。','bad');
  } else if(state.sp>30 && state.spCollapsed){
    state.spCollapsed = false;
    state.maxMP = Math.round(state.maxMP/0.8);
    pushLog('你花了不少心力修復關係，Debuff 解除，MaxMP 恢復正常。','good');
  }
}

function checkLevelUp(){
  const newGrade = gradeIndex(state.exp);
  if(newGrade !== (state.lastGrade||0)){
    state.lastGrade = newGrade;
    state.maxHP += 10; state.maxMP += 5; state.hp=state.maxHP; state.mp=state.maxMP;
    pushLog(`🎉 升職！你現在是「${TITLES_GRADE[newGrade]}」了。MaxHP/MaxMP 提升，並完全恢復。`,'levelup');
  }
  const newRole = roleIndex(state.rep);
  if(newRole !== (state.lastRole||0)){
    state.lastRole = newRole;
    pushLog(`🏆 職位晉升！你現在是「${TITLES_ROLE[newRole]}」，可以帶領更多人了。`,'levelup');
  }
}

/* ---- init ---- */
(function init(){
  const s = load();
  if(s){ state=s; currentScreen='hub'; }
  render();
})();
</script>
