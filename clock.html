<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock &amp; Timer</title>
<style>
:root{
  --ink:#0a0b0b; --panel:#141514; --line:rgba(237,237,236,.14); --line-2:rgba(237,237,236,.07);
  --paper:#ededec; --dim:rgba(237,237,236,.6); --faint:rgba(237,237,236,.34); --bright:#fff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f:cubic-bezier(.6,0,.05,1);
}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:300;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.tabs{display:flex;gap:6px;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:100px;padding:9px 16px;background:none;cursor:pointer;transition:.35s var(--f)}
.tab:hover{color:var(--paper);border-color:var(--paper)}
.tab.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,60px);position:relative}
.view{display:none;width:100%;max-width:1000px}
.view.on{display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* big clock */
.big{text-align:center}
.big .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:300;
  font-size:clamp(58px,17vw,220px);line-height:.9;letter-spacing:-.02em}
.big .t .ss{color:var(--faint)}
.big .sub{margin-top:22px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.big .sub b{color:var(--paper);font-weight:400}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  text-align:center;margin-top:34px}

/* world */
.world{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.wc{background:var(--ink);padding:20px 22px;transition:background .4s var(--f)}
.wc:hover{background:var(--panel)}
.wc .city{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.wc .city .off{color:var(--faint)}
.wc .tt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:300;font-size:38px;line-height:1;margin-top:12px}
.wc .tt .ss{color:var(--faint);font-size:.55em}
.wc .dd{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);margin-top:8px;text-transform:uppercase}
.wc.home{outline:1px solid var(--bright);outline-offset:-1px}

/* stopwatch & countdown shared */
.timer{text-align:center}
.timer .disp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:300;
  font-size:clamp(56px,15vw,180px);line-height:.9;letter-spacing:-.02em}
.timer .disp .cs,.timer .disp .u{color:var(--faint)}
.timer.done .disp{color:var(--bright);animation:flash 1s var(--f) infinite}
@keyframes flash{50%{opacity:.25}}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:12px 24px;
  border:1px solid var(--line);border-radius:100px;background:none;color:var(--paper);cursor:pointer;transition:.35s var(--f)}
.btn:hover{border-color:var(--paper)}
.btn.pri{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.pri:hover{background:var(--bright);border-color:var(--bright)}
.laps{max-width:320px;margin:26px auto 0;max-height:150px;overflow:auto}
.laps .lap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;
  color:var(--dim);padding:8px 0;border-bottom:1px solid var(--line-2);letter-spacing:.06em}
.laps .lap b{color:var(--paper);font-weight:400}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.preset{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;
  border:1px solid var(--line);border-radius:100px;background:none;color:var(--dim);cursor:pointer;transition:.3s var(--f)}
.preset:hover{color:var(--paper);border-color:var(--paper)}
.setrow{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:22px;font-family:var(--mono)}
.setrow input{width:70px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--paper);
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;text-align:center;padding:10px 6px;outline:none}
.setrow input:focus{border-color:var(--paper)}
.setrow .colon{font-size:24px;color:var(--faint)}
.setrow label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab on" data-v="big">大時鐘 · Clock</button>
  <button class="tab" data-v="world">多國時間 · World</button>
  <button class="tab" data-v="stop">計時 · Stopwatch</button>
  <button class="tab" data-v="down">倒數 · Countdown</button>
</div>

<div class="stage">
  <!-- big clock -->
  <div class="view on" id="v-big">
    <div class="big">
      <div class="t" id="bigT">00:00<span class="ss">:00</span></div>
      <div class="sub"><span id="bigDay">—</span><span id="bigDate">—</span><span>TZ · <b id="bigTz">—</b></span></div>
      <div class="hint">Local time · updates live</div>
    </div>
  </div>

  <!-- world -->
  <div class="view" id="v-world">
    <div class="world" id="worldGrid"></div>
  </div>

  <!-- stopwatch -->
  <div class="view" id="v-stop">
    <div class="timer">
      <div class="disp" id="swDisp">00:00<span class="cs">.00</span></div>
      <div class="ctrls">
        <button class="btn pri" id="swStart">Start</button>
        <button class="btn" id="swLap">Lap</button>
        <button class="btn" id="swReset">Reset</button>
      </div>
      <div class="laps" id="swLaps"></div>
    </div>
  </div>

  <!-- countdown -->
  <div class="view" id="v-down">
    <div class="timer" id="cdWrap">
      <div class="disp" id="cdDisp">05:00</div>
      <div class="presets">
        <button class="preset" data-min="1">1 min</button>
        <button class="preset" data-min="3">3 min</button>
        <button class="preset" data-min="5">5 min</button>
        <button class="preset" data-min="10">10 min</button>
        <button class="preset" data-min="25">25 min</button>
      </div>
      <div class="setrow">
        <div><input id="cdMin" type="number" min="0" max="99" value="5"><label>Min</label></div>
        <span class="colon">:</span>
        <div><input id="cdSec" type="number" min="0" max="59" value="0"><label>Sec</label></div>
      </div>
      <div class="ctrls">
        <button class="btn pri" id="cdStart">Start</button>
        <button class="btn" id="cdReset">Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const pad=(n,l=2)=>String(n).padStart(l,'0');

/* tabs */
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t.dataset.v));
});

/* big clock */
const bigTz=Intl.DateTimeFormat().resolvedOptions().timeZone;
$('#bigTz').textContent=bigTz;
function tickBig(){
  const d=new Date();
  $('#bigT').innerHTML=`${pad(d.getHours())}:${pad(d.getMinutes())}<span class="ss">:${pad(d.getSeconds())}</span>`;
  $('#bigDay').textContent=d.toLocaleDateString('en-US',{weekday:'long'});
  $('#bigDate').textContent=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

/* world clock */
const CITIES=[
  ['Johnny's Time','Asia/Taipei'],['Hong Kong','Asia/Hong_Kong'],['Tokyo','Asia/Tokyo'],
  ['Singapore','Asia/Singapore'],['Dubai','Asia/Dubai'],['London','Europe/London'],
  ['Paris','Europe/Paris'],['Berlin','Europe/Berlin'],['New York','America/New_York'],
  ['Los Angeles','America/Los_Angeles'],['São Paulo','America/Sao_Paulo'],['Sydney','Australia/Sydney']
];
const grid=$('#worldGrid');
CITIES.forEach(([name,tz],i)=>{
  const el=document.createElement('div');
  el.className='wc'+(tz===bigTz?' home':'');
  el.innerHTML=`<div class="city"><span>${name}</span><span class="off" data-off></span></div>
    <div class="tt" data-tt>--:--<span class="ss">:--</span></div>
    <div class="dd" data-dd>—</div>`;
  el.dataset.tz=tz; grid.appendChild(el);
});
function offset(tz,d){
  // hours offset from UTC for tz
  const s=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(d)
    .find(p=>p.type==='timeZoneName');
  return s?s.value.replace('GMT','UTC'):'';
}
function tickWorld(){
  const d=new Date();
  grid.querySelectorAll('.wc').forEach(el=>{
    const tz=el.dataset.tz;
    const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);
    const g=t=>(p.find(x=>x.type===t)||{}).value||'00';
    el.querySelector('[data-tt]').innerHTML=`${g('hour')}:${g('minute')}<span class="ss">:${g('second')}</span>`;
    el.querySelector('[data-dd]').textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',day:'2-digit',month:'short'}).format(d);
    el.querySelector('[data-off]').textContent=offset(tz,d);
  });
}

/* stopwatch */
let swT=0, swRun=false, swLast=0, swRaf=null, swLapN=0, swPrev=0;
function fmtSW(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,cs=Math.floor(ms/10)%100;
  return `${pad(m)}:${pad(s)}<span class="cs">.${pad(cs)}</span>`;}
function swLoop(now){ if(!swRun)return; if(!swLast)swLast=now; swT+=now-swLast; swLast=now;
  $('#swDisp').innerHTML=fmtSW(swT); swRaf=requestAnimationFrame(swLoop);}
$('#swStart').onclick=()=>{ swRun=!swRun;
  $('#swStart').textContent=swRun?'Pause':'Start'; $('#swStart').classList.toggle('pri',!swRun);
  if(swRun){swLast=0;swRaf=requestAnimationFrame(swLoop);}else cancelAnimationFrame(swRaf);};
$('#swReset').onclick=()=>{swRun=false;cancelAnimationFrame(swRaf);swT=0;swLast=0;swLapN=0;swPrev=0;
  $('#swDisp').innerHTML=fmtSW(0);$('#swStart').textContent='Start';$('#swStart').classList.add('pri');$('#swLaps').innerHTML='';};
$('#swLap').onclick=()=>{ if(!swT)return; swLapN++; const split=swT-swPrev; swPrev=swT;
  const row=document.createElement('div');row.className='lap';
  row.innerHTML=`<span>Lap ${pad(swLapN)}</span><span><b>${fmtSW(split).replace(/<[^>]+>/g,'')}</b> · ${fmtSW(swT).replace(/<[^>]+>/g,'')}</span>`;
  $('#swLaps').prepend(row);};

/* countdown */
let cdTotal=300000, cdLeft=300000, cdRun=false, cdLast=0, cdRaf=null, actx=null;
function fmtCD(ms){ms=Math.max(0,ms);const t=Math.ceil(ms/1000);const m=Math.floor(t/60),s=t%60;return `${pad(m)}:${pad(s)}`;}
function drawCD(){$('#cdDisp').textContent=fmtCD(cdLeft);}
function setCD(){cdTotal=cdLeft=(Math.min(99,Math.max(0,+$('#cdMin').value||0))*60+Math.min(59,Math.max(0,+$('#cdSec').value||0)))*1000;
  $('#cdWrap').classList.remove('done');drawCD();}
$('#cdMin').oninput=$('#cdSec').oninput=()=>{if(!cdRun)setCD();};
$$('.preset').forEach(b=>b.onclick=()=>{if(cdRun)return;$('#cdMin').value=b.dataset.min;$('#cdSec').value=0;setCD();});
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    o.frequency.value=880;o.type='sine';const t=actx.currentTime+i*0.4;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);o.start(t);o.stop(t+0.34);}}catch(e){}}
function cdLoop(now){ if(!cdRun)return; if(!cdLast)cdLast=now; cdLeft-=now-cdLast; cdLast=now;
  if(cdLeft<=0){cdLeft=0;drawCD();cdRun=false;$('#cdStart').textContent='Start';$('#cdStart').classList.add('pri');
    $('#cdWrap').classList.add('done');beep();return;}
  drawCD(); cdRaf=requestAnimationFrame(cdLoop);}
$('#cdStart').onclick=()=>{ if(cdLeft<=0)setCD(); if(cdLeft<=0)return;
  cdRun=!cdRun; $('#cdStart').textContent=cdRun?'Pause':'Start'; $('#cdStart').classList.toggle('pri',!cdRun);
  $('#cdWrap').classList.remove('done');
  if(cdRun){ if(actx)actx.resume(); else beep.call&&(actx=null); cdLast=0; cdRaf=requestAnimationFrame(cdLoop);}
  else cancelAnimationFrame(cdRaf);};
$('#cdReset').onclick=()=>{cdRun=false;cancelAnimationFrame(cdRaf);$('#cdWrap').classList.remove('done');setCD();
  $('#cdStart').textContent='Start';$('#cdStart').classList.add('pri');};

/* run */
setCD();
function everySecond(){tickBig();tickWorld();}
everySecond(); setInterval(everySecond,1000);
</script>
</body>
</html>
